apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: s3store1
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store1
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: s3-store
          app.kubernetes.io/instance: s3store1
          app.kubernetes.io/part-of: stacpkg-tests
      template:
        metadata:
          labels:
            app.kubernetes.io/name: s3-store
            app.kubernetes.io/instance: s3store1
            app.kubernetes.io/part-of: stacpkg-tests
        spec:
          containers:
            - name: s3-store
              image: quay.io/minio/minio:latest
              imagePullPolicy: IfNotPresent
              args:
                - server
                - /data
                - --console-address
                - :9001
              envFrom:
                - secretRef:
                    name: s3-store1-root
              ports:
                - name: api
                  containerPort: 9000
                - name: console
                  containerPort: 9001
              readinessProbe:
                httpGet:
                  path: /minio/health/ready
                  port: api
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /minio/health/live
                  port: api
                initialDelaySeconds: 10
                periodSeconds: 10
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: s3store1
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store1
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      selector:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store1
        app.kubernetes.io/part-of: stacpkg-tests
      ports:
        - name: api
          port: 9000
          targetPort: api
        - name: console
          port: 9001
          targetPort: console
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: s3store2
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store2
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: s3-store
          app.kubernetes.io/instance: s3store2
          app.kubernetes.io/part-of: stacpkg-tests
      template:
        metadata:
          labels:
            app.kubernetes.io/name: s3-store
            app.kubernetes.io/instance: s3store2
            app.kubernetes.io/part-of: stacpkg-tests
        spec:
          containers:
            - name: s3-store
              image: quay.io/minio/minio:latest
              imagePullPolicy: IfNotPresent
              args:
                - server
                - /data
                - --console-address
                - :9001
              envFrom:
                - secretRef:
                    name: s3-store2-root
              ports:
                - name: api
                  containerPort: 9000
                - name: console
                  containerPort: 9001
              readinessProbe:
                httpGet:
                  path: /minio/health/ready
                  port: api
                initialDelaySeconds: 5
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /minio/health/live
                  port: api
                initialDelaySeconds: 10
                periodSeconds: 10
              volumeMounts:
                - name: data
                  mountPath: /data
          volumes:
            - name: data
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: s3store2
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store2
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      selector:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store2
        app.kubernetes.io/part-of: stacpkg-tests
      ports:
        - name: api
          port: 9000
          targetPort: api
        - name: console
          port: 9001
          targetPort: console
