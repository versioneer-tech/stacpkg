apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: s3store1
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store1
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: s3-store
          app.kubernetes.io/instance: s3store1
          app.kubernetes.io/part-of: stacpkg-tests
      template:
        metadata:
          labels:
            app.kubernetes.io/name: s3-store
            app.kubernetes.io/instance: s3store1
            app.kubernetes.io/part-of: stacpkg-tests
        spec:
          automountServiceAccountToken: false
          containers:
            - name: s3-store
              image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: s3-store1-root
                      key: accesskey
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: s3-store1-root
                      key: secretkey
              ports:
                - name: api
                  containerPort: 9000
              readinessProbe:
                httpGet:
                  path: /minio/health/ready
                  port: api
                initialDelaySeconds: 5
                periodSeconds: 5
  - apiVersion: v1
    kind: Service
    metadata:
      name: s3store1
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store1
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      selector:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store1
        app.kubernetes.io/part-of: stacpkg-tests
      ports:
        - name: api
          port: 9000
          targetPort: api
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: s3store2
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store2
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: s3-store
          app.kubernetes.io/instance: s3store2
          app.kubernetes.io/part-of: stacpkg-tests
      template:
        metadata:
          labels:
            app.kubernetes.io/name: s3-store
            app.kubernetes.io/instance: s3store2
            app.kubernetes.io/part-of: stacpkg-tests
        spec:
          automountServiceAccountToken: false
          containers:
            - name: s3-store
              image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              env:
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: s3-store2-root
                      key: accesskey
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: s3-store2-root
                      key: secretkey
              ports:
                - name: api
                  containerPort: 9000
              readinessProbe:
                httpGet:
                  path: /minio/health/ready
                  port: api
                initialDelaySeconds: 5
                periodSeconds: 5
  - apiVersion: v1
    kind: Service
    metadata:
      name: s3store2
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store2
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      selector:
        app.kubernetes.io/name: s3-store
        app.kubernetes.io/instance: s3store2
        app.kubernetes.io/part-of: stacpkg-tests
      ports:
        - name: api
          port: 9000
          targetPort: api
