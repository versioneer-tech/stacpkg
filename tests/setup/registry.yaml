apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: registry
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: registry
          app.kubernetes.io/part-of: stacpkg-tests
      template:
        metadata:
          labels:
            app.kubernetes.io/name: registry
            app.kubernetes.io/part-of: stacpkg-tests
        spec:
          containers:
            - name: registry
              image: registry:2
              imagePullPolicy: IfNotPresent
              ports:
                - name: registry
                  containerPort: 5000
              env:
                - name: REGISTRY_AUTH
                  value: htpasswd
                - name: REGISTRY_AUTH_HTPASSWD_REALM
                  value: stacpkg e2e registry
                - name: REGISTRY_AUTH_HTPASSWD_PATH
                  value: /auth/htpasswd
              readinessProbe:
                tcpSocket:
                  port: registry
                initialDelaySeconds: 3
                periodSeconds: 5
              livenessProbe:
                tcpSocket:
                  port: registry
                initialDelaySeconds: 10
                periodSeconds: 10
              volumeMounts:
                - name: registry-data
                  mountPath: /var/lib/registry
                - name: registry-auth
                  mountPath: /auth
                  readOnly: true
          volumes:
            - name: registry-data
              emptyDir: {}
            - name: registry-auth
              secret:
                secretName: registry-basic-auth
  - apiVersion: v1
    kind: Service
    metadata:
      name: registry
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      selector:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: stacpkg-tests
      ports:
        - name: registry
          port: 5000
          targetPort: registry
