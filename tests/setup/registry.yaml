apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: registry
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: registry
          app.kubernetes.io/part-of: stacpkg-tests
      template:
        metadata:
          labels:
            app.kubernetes.io/name: registry
            app.kubernetes.io/part-of: stacpkg-tests
        spec:
          containers:
            - name: registry
              image: registry:2
              imagePullPolicy: IfNotPresent
              ports:
                - name: registry
                  containerPort: 5000
              readinessProbe:
                httpGet:
                  path: /v2/
                  port: registry
                initialDelaySeconds: 3
                periodSeconds: 5
              livenessProbe:
                httpGet:
                  path: /v2/
                  port: registry
                initialDelaySeconds: 10
                periodSeconds: 10
              volumeMounts:
                - name: registry-data
                  mountPath: /var/lib/registry
          volumes:
            - name: registry-data
              emptyDir: {}
  - apiVersion: v1
    kind: Service
    metadata:
      name: registry
      namespace: stacpkg-s3-store
      labels:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: stacpkg-tests
    spec:
      selector:
        app.kubernetes.io/name: registry
        app.kubernetes.io/part-of: stacpkg-tests
      ports:
        - name: registry
          port: 5000
          targetPort: registry
