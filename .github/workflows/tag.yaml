name: Publish stacpkg

on:
  push:
    tags:
      - "[0-9]+\\.[0-9]+\\.[0-9]+"
      - "[0-9]+\\.[0-9]+\\.[0-9]+-alpha\\.[0-9]+"
      - "[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+"
      - "[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install project dependencies
        run: uv sync --all-groups --frozen

      - name: Run unit tests
        run: make test-unit

  build_python_package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build package distributions
        run: uv build

      - name: Verify package version matches tag
        run: |
          package_version="$(basename dist/stacpkg-*.whl)"
          package_version="${package_version#stacpkg-}"
          package_version="${package_version%%-*}"

          tag_version="${GITHUB_REF_NAME#v}"
          case "${tag_version}" in
            *-alpha.*)
              tag_version="${tag_version%-alpha.*}a${tag_version##*-alpha.}"
              ;;
            *-beta.*)
              tag_version="${tag_version%-beta.*}b${tag_version##*-beta.}"
              ;;
            *-rc.*)
              tag_version="${tag_version%-rc.*}rc${tag_version##*-rc.}"
              ;;
          esac

          if [ "${package_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
            exit 1
          fi

      - name: Store package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish_pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    needs: build_python_package
    environment:
      name: pypi
      url: https://pypi.org/p/stacpkg
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build_and_publish_image:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: unit
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install docs dependencies
        run: uv sync --group docs --frozen

      - name: Build docs
        run: make docs

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs to GitHub Pages (gh-pages via mike)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gh-pages --depth=1 || true
          uv run mike deploy --branch gh-pages "${GITHUB_REF_NAME}" latest --update-alias --push
          uv run mike set-default --branch gh-pages latest --push
