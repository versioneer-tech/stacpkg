name: Publish stacpkg

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  verify_release_commit:
    name: Verify release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Clone the release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify successful main-branch tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          curl --fail --silent --show-error --location --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "branch=main" \
            --data-urlencode "event=push" \
            --data-urlencode "head_sha=${release_commit}" \
            --data-urlencode "status=success" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yaml/runs" \
            | python scripts/check_release_run.py "${release_commit}"

  build_python_package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: verify_release_commit
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build package distributions
        run: uv build

      - name: Verify package version matches tag
        run: |
          package_version="$(basename dist/stacpkg-*.whl)"
          package_version="${package_version#stacpkg-}"
          package_version="${package_version%%-*}"

          tag_version="${GITHUB_REF_NAME#v}"
          case "${tag_version}" in
            *-alpha.*)
              tag_version="${tag_version%-alpha.*}a${tag_version##*-alpha.}"
              ;;
            *-beta.*)
              tag_version="${tag_version%-beta.*}b${tag_version##*-beta.}"
              ;;
            *-rc.*)
              tag_version="${tag_version%-rc.*}rc${tag_version##*-rc.}"
              ;;
          esac

          if [ "${package_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${package_version}"
            exit 1
          fi

      - name: Store package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish_pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    needs: build_python_package
    environment:
      name: pypi
      url: https://pypi.org/p/stacpkg
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build_docs:
    name: Build and publish docs
    runs-on: ubuntu-latest
    needs: build_python_package
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install docs dependencies
        run: uv sync --group docs --frozen

      - name: Build docs
        run: make docs

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs to GitHub Pages (gh-pages via mike)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin gh-pages --depth=1 || true
          case "${GITHUB_REF_NAME}" in
            *-alpha.*|*-beta.*|*-rc.*)
              uv run mike deploy --branch gh-pages "${GITHUB_REF_NAME}" --push
              ;;
            *)
              uv run mike deploy --branch gh-pages "${GITHUB_REF_NAME}" latest --update-aliases --push
              uv run mike set-default --branch gh-pages latest --push
              ;;
          esac
