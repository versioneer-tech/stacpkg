# Copyright 2026, Versioneer (https://versioneer.at)
# SPDX-License-Identifier: Apache-2.0

site_name: stacpkg
site_url: https://stacpkg.versioneer.at/
repo_url: https://github.com/versioneer-tech/stacpkg
repo_name: versioneer-tech/stacpkg
copyright: "Copyright &copy; 2026, Versioneer"
nav:
  - Home: index.md
  - Tutorials:
    - Create and share a package: tutorials/create-stac-package.md
    - Relocate assets: tutorials/relocate-assets.md
  - Use cases:
    - Offline handover: generated/usecases/offline-package-handover.md
    - Relocate selected assets: generated/usecases/openaerialmap-verified-relocation.md
    - S3 and OCI handover: generated/usecases/openaerialmap-package-handover-to-recipient-storage.md
  - Architecture:
    - Overview: architecture/index.md
    - Package data and table pipelines: architecture/0001-package-and-pipelines.md
    - Relocation and validation: architecture/0002-relocation-and-validation.md
    - Package distribution: architecture/0003-distribution-and-evidence.md
  - Reference:
    - CLI: reference-guides/cli.md
    - Items: reference-guides/items.md
    - Asset lock: reference-guides/asset-lock.md
validation:
  nav:
    omitted_files: warn
  links:
    unrecognized_links: warn
    anchors: warn
plugins:
  - search
  - mike
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
theme:
  name: material
  language: en
  logo: imgs/logo.png
  favicon: imgs/favicon.ico
  features:
    - content.code.copy
    - search.suggest
    - toc.follow
    - toc.permalink
  palette:
    - scheme: default
      primary: white
extra:
  version:
    provider: mike
